
  services:
    app:
      build: .
      ports:
        - "8080:8080"
      environment:
        DB_URL: jdbc:mysql://mysql:3306/shopapi
        DB_USERNAME: shopapi
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
        BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
        BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
        BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
        MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
        MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
        MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
        MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
        MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
      healthcheck:
        test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8080/actuator/health/readiness"]
        interval: 15s
        timeout: 5s
        retries: 3
        start_period: 45s
      depends_on:
        mysql:
          condition: service_healthy

    mysql:
      image: mysql:8.4
      environment:
        MYSQL_DATABASE: shopapi
        MYSQL_USER: shopapi
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ports:
        - "3307:3306"
      volumes:
        - shopapi-mysql-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 30s

  volumes:
    shopapi-mysql-data:
