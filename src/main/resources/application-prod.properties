spring.application.name=mini-ecommerce

# Production credentials must be provided through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Do not mutate the schema automatically in production; use managed migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep API documentation disabled in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT_SECRET must be a unique, random secret of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
